# Board validation rules for esp32s3-devkit-5v (rev-2, dual rail)
# Used by scripts/validate_board.py to verify design intent beyond ERC/DRC.
#
# Power path: J1 VBAT -> Q1 reverse-protection PMOS -> PFET -> dual TPS63070.
# SW1 switches U1 EN only, via R31 10k; OFF throw and R32 pull EN to GND.
# Input chemistry/load remain provisional; cold start requires >=3V at VIN.
#   U1 -> 3.3V (SW1 enabled: ESP32, RTC, OLED switch, RGB LED, pull-ups)
#   U2 -> 5V   (GPIO18-gated via R19 pulldown: MAX98357A amp only)
# USB-C is data-only (VBUS biases ESD and the isolated presence detector); CC1 and CC2 each have 5.1k to GND.

required_components:
  Q4:
    value: "MMBT3904"
  Q5:
    value: "MMBT3904"
  Q6:
    value: "AO3401A"
  Q7:
    value: "MMBT3904"
  R40:
    value: "100k"
  R41:
    value: "1M"
  R42:
    value: "47k"
  R43:
    value: "10k"
  R44:
    value: "47k"
  R45:
    value: "100k"
  R46:
    value: "10k"
  R47:
    value: "100k"
  R48:
    value: "33k"
  R49:
    value: "10k"
  C34:
    value: "0.1uF"
  # --- regulators / power path ---
  U1:
    value: "TPS63070RNMR"
  U2:
    value: "TPS63070RNMR"
  Q1:
    value: "AO3401A"
  L1:
    value: "1.5µH"
  L2:
    value: "1.5µH"
  SW1:
    value: "MSK12C02"
  # --- MCU / interfaces ---
  U3:
    value: "ESP32-S3-WROOM-1-N16"
  U4:
    value: "USBLC6-2SC6"
  # --- rev-2 peripherals ---
  U5:
    value: "RV-3028-C7"     # RTC, I2C 0x52, /INT -> GPIO1 deep-sleep wake
  U6:
    value: "MAX98357A"      # I2S class-D amp on the 5V rail
  Q2:
    value: "AO3401A"        # OLED high-side load switch (GPIO41 via Q3)
  Q3:
    value: "MMBT3904"       # inverts GPIO41 so HIGH = OLED on
  D2:
    value: "150141M173100"       # status LED, common anode; active LOW, GPIO38/39/40
  # --- U1 3.3V stage ---
  R3:
    value: "10kΩ"           # U1 PS/SYNC pull-up to PFET: HIGH enables power save
  R4:
    value: "470kΩ"          # 3.3V FB divider upper
  R5:
    value: "150kΩ"          # 3.3V FB divider lower
  R6:
    value: "100kΩ"          # U1 PG pull-up
  C1:
    value: "10µF"           # U1 input caps (PFET)
  C2:
    value: "10µF"
  C3:
    value: "10µF"
  C4:
    value: "0.1µF"          # U1 VAUX cap — datasheet-required, must not be loaded
  # --- U2 5V stage ---
  R7:
    value: "10kΩ"           # U2 PS/SYNC pull-up to PFET: HIGH enables power save
  R8:
    value: "680kΩ"          # 5V FB divider upper
  R9:
    value: "130kΩ"          # 5V FB divider lower
  R10:
    value: "100kΩ"          # U2 PG pull-up
  R19:
    value: "100kΩ"          # U2 EN pulldown: 5V rail OFF until GPIO18 drives high
  C9:
    value: "10µF"           # U2 input caps (PFET)
  C10:
    value: "10µF"
  C11:
    value: "10µF"
  C12:
    value: "0.1µF"          # U2 VAUX cap
  # --- reverse protection / boot / USB ---
  R1:
    value: "100kΩ"          # Q1 gate pulldown
  R12:
    value: "10kΩ"           # IO0 (BOOT) pull-up
  R13:
    value: "10kΩ"           # EN pull-up
  C19:
    value: "1µF"            # EN reset RC
  R14:
    value: "5.1kΩ"          # USB-C CC pulldowns (sink identity)
  R15:
    value: "5.1kΩ"
  # --- I2C bus + RTC ---
  R16:
    value: "4.7kΩ"          # SCL pull-up on main RTC bus
  R17:
    value: "4.7kΩ"          # SDA pull-up
  R18:
    value: "10kΩ"           # RTC /INT pull-up (GPIO1)
  # --- amp control ---
  R20:
    value: "100kΩ"          # AMP_SD pulldown at U8 output; GPIO21 high = play
  # --- OLED load switch ---
  R21:
    value: "100kΩ"          # Q2 gate pull-up (default off)
  R22:
    value: "10kΩ"           # Q3 base resistor from GPIO41
  R23:
    value: "100kΩ"          # Q3 base pulldown (off at boot / deep sleep)
  # --- front panel ---
  R24:
    value: "10kΩ"           # button pull-ups (external: reliable EXT1 wake)
  R25:
    value: "10kΩ"
  R26:
    value: "10kΩ"
  R27:
    value: "10kΩ"
  C22:
    value: "0.1µF"          # button debounce
  C23:
    value: "0.1µF"
  C24:
    value: "0.1µF"
  C25:
    value: "0.1µF"
  R28:
    value: "330Ω"           # RGB red series
  R29:
    value: "150Ω"           # RGB green series
  R30:
    value: "150Ω"           # RGB blue series
  # --- misc ---
  R11:
    value: "1kΩ"            # D1 power LED series; DNP for low sleep current
  C21:
    value: "100µF"          # 3v3 bulk, drawn in the RTC block (1206)
  # --- amp-local caps (draw cluster at U6; place there in layout) ---
  C26:
    value: "100µF"          # amp burst reservoir
  C27:
    value: "10µF"           # amp mid-frequency
  C28:
    value: "0.1µF"          # amp HF decoupling at VDD pins 7/8
  J1: {}                    # battery JST-PH
  J2: {}                    # USB-C
  J3: {}                    # speaker JST-PH
  J4: {}                    # OLED header (switched VDD)
  SW2: {}                   # RESET
  SW3: {}                   # BOOT
  SW4:
    value: "VOL-"          # left button, GPIO4
  SW5:
    value: "MODE"          # center button, GPIO5
  SW6:
    value: "VOL+"          # right button, GPIO6
  SW7:
    value: "BATTERY"       # battery indication request, GPIO10, RTC-capable for wake

  # September 2026 power-state and USB corrections.
  U7:
    value: "SN74LVC2G66DCUR"
  U8:
    value: "SN74LVC1T45DBVR"
  R31:
    value: "10kΩ"
  R32:
    value: "100kΩ"
  R33:
    value: "10kΩ"
  R34:
    value: "22Ω"
  R35:
    value: "22Ω"
  R36:
    value: "100kΩ"
  R37:
    value: "4.7kΩ"
  R38:
    value: "4.7kΩ"
  R39:
    value: "100kΩ"
  C29:
    value: "0.1µF"
  C30:
    value: "0.1µF"
  C31:
    value: "1µF"
  C32:
    value: "0.1µF"
  C33:
    value: "0.1µF"

required_nets:
  - "GPIO2"
  - "GPIO7"
  - "GPIO12"
  - "GPIO13"
  - "GPIO15"
  - "GND"
  - "3v3"
  - "5v"
  - "VBAT"
  - "EN_3V3"
  - "USB_VBUS"
  - "USB_CC1"
  - "OLED_3V3"
  - "OLED_SCL"
  - "OLED_SDA"
  - "AMP_SD"
  - "GPIO11"
  - "RTC_VBACKUP"
  - "PFET"
  - "D+"
  - "D-"
  - "GPIO1"    # RTC /INT
  - "GPIO41"    # OLED power gate
  - "GPIO18"   # 5V boost enable
  - "GPIO21"   # amp SD_MODE

# These are nominal bookkeeping sums, not DC-bias-corrected capacitance or stability proof.
capacitor_budget:
  input_u1:
    min_total_uf: 20
    refs: [C1, C2, C3]
  input_u2:
    min_total_uf: 20
    refs: [C9, C10, C11]
  output_3v3:
    min_total_uf: 60
    refs: [C5, C6, C7, C8, C17, C21]
  output_5v:
    # U2 output caps (C13-C16, at the converter) + amp-local cluster
    # (C26 bulk reservoir, C27 mid, drawn at U6 for placement intent).
    # 186µF total — sized against the volume-induced brownouts this board
    # exists to fix.
    min_total_uf: 150
    refs: [C13, C14, C15, C16, C26, C27]
  decoupling:
    refs: [C4, C12, C18, C20, C28, C29, C30, C32, C33]

# TPS63070 feedback dividers: V_OUT = V_REF * (1 + R_upper / R_lower),
# V_REF = 0.8V per datasheet SLVSC58B §7.5. Guards the exact class of bug
# fixed in PR #107 (and now covers the new 5V rail too).
voltage_dividers:
  - name: "3.3V rail (U1)"
    v_ref: 0.8
    expected_voltage: 3.3
    tolerance_percent: 2.0
    upper_ref: R4
    lower_ref: R5
  - name: "5V rail (U2)"
    v_ref: 0.8
    expected_voltage: 5.0
    tolerance_percent: 2.0
    upper_ref: R8
    lower_ref: R9

bom_rules:
  require_footprint: true
  no_duplicate_refs: true
  require_datasheet_on: [U1, U2, U3, U4, U5, U6, U7, U8, Q1, Q2, Q3, Q4, Q5, Q6, Q7, L1, L2]
