# Schematic-derived topology regressions for the dual TPS63070 board.
# Battery sweep scenarios assume three AA cells (4.8 / 3.6 / 3.0 V); the final
# pack is not yet specified. Primary sweep leaves U2 disabled. The separate
# schematic_dual_rail pass enables GPIO18 and loads both outputs.
# TPS63070_TRANS.LIB is a repository behavioral approximation, not TI's
# switching model. Rail voltages validate topology; ripple, current, thermal
# performance and physical startup behavior require hardware validation.
# Additional ESP-NOW fixtures are illustrative behavioral battery/load models.
spec_version: 1
spice_engine: ngspice

assembly:
  main: sim/kicad_export.cir
  includes:
    - ../../libs/spice/tps63070/TPS63070_TRANS.LIB

scenarios:
  - id: vbat_bias_op
    measures:
      - id: v_vbat_sw
        title: "Protected battery rail DC bias (4.8 V pack at t=0)"
        op_node: "PFET"
        min: 4.5
        max: 4.85
  - id: tran_fresh_4v8
    measures:
      - id: v3v3_steady_fresh
        title: "Vout steady, fresh pack (95 µs)"
        min: 3.28
        max: 3.33
      - id: v3v3_ripple_fresh
        title: "Vout ripple peak-peak, fresh pack idle"
        max: 0.15
      - id: v3v3_burst_fresh_min
        title: "Vout minimum during 0.5 A burst at 4.8 V"
        min: 3.1
  - id: tran_mid_3v6
    measures:
      - id: v3v3_steady_mid
        title: "Vout steady at 3.6 V (buck-boost transition)"
        min: 3.28
        max: 3.33
      - id: v3v3_burst_mid_min
        title: "Vout minimum during 0.5 A burst at 3.6 V"
        min: 3.1
  - id: tran_low_3v0
    measures:
      - id: v3v3_steady_low
        title: "Vout steady on end-of-life pack (3.0 V)"
        min: 3.28
        max: 3.33
      - id: v3v3_burst_low_min
        title: "Vout minimum during 0.5 A burst at 3.0 V (boost mode)"
        min: 3.0
      - id: vbat_sw_burst_low_min
        title: "Protected battery rail present during worst burst (wiring check)"
        group: tran_low_extra
        min: 2.5
      - id: i_bat_passive_late
        title: "Battery-side passive drain at idle, post-settling (pull-ups + FB dividers; repository model is quasi-ideal and does not draw converter input current)"
        group: tran_low_extra
        abs_value: true
        max: 0.002
  - id: tran_recovery
    measures:
      - id: v3v3_recovery
        title: "Vout recovered at idle on dead pack (800 µs)"
        min: 3.28
        max: 3.33

secondary_passes:
  - netlist_rel: sim/tran_dual_rail.cir
    scenarios:
      - id: schematic_dual_rail
        measures:
          - id: rail5_disabled
            title: "Schematic U2 remains disabled before GPIO18 assertion"
            max: 0.05
          - id: rail5_enabled
            title: "Schematic U2 regulates with 0.6 A modeled audio load"
            min: 4.95
            max: 5.02
          - id: rail3_dual
            title: "Schematic U1 regulates while both modeled rails are loaded"
            min: 3.28
            max: 3.33
  - netlist_rel: sim/tran_startup_3v0.cir
    scenarios:
      - id: tran_startup_3v0
        measures:
          - id: startup3v0_vout_final
            title: "Cold start at 3.0 V — Vout at 380 µs"
            group: tran_startup
            min: 3.28
            max: 3.33
          - id: startup3v0_post_min
            title: "Cold start at 3.0 V — Vout floor after settling"
            group: tran_startup
            min: 3.2

  - netlist_rel: sim/tran_espnow_fresh.cir
    scenarios:
      - id: espnow_fresh
        measures:
          - id: espnow_fresh_vin_min
            title: "ESP-NOW bursts, fresh pack — VIN minimum (behavioral converter)"
            group: espnow_brownout
            min: 4.1
          - id: espnow_fresh_v3v3_min
            title: "ESP-NOW bursts, fresh pack — 3V3 minimum"
            group: espnow_brownout
            min: 3.25
  - netlist_rel: sim/tran_espnow_tired.cir
    scenarios:
      - id: espnow_tired
        measures:
          - id: espnow_tired_vin_min
            title: "ESP-NOW bursts, tired pack (3.6V/1.2R) — VIN sag stays above 2.0V UVLO"
            group: espnow_brownout
            min: 2.3
            max: 3.0
          - id: espnow_tired_v3v3_min
            title: "ESP-NOW bursts, tired pack — 3V3 holds"
            group: espnow_brownout
            min: 3.25
  - netlist_rel: sim/tran_espnow_dead.cir
    scenarios:
      - id: espnow_dead
        measures:
          - id: espnow_dead_v3v3_min
            title: "ESP-NOW burst, dead pack (3.0V/3R) — brownout MUST occur (failure-boundary regression)"
            group: espnow_brownout
            max: 2.5
          - id: espnow_dead_v3v3_recovered
            title: "Dead-pack brownout — rail recovers after burst"
            group: espnow_brownout
            min: 3.25
            max: 3.35
  - netlist_rel: sim/tran_rev2_amp_preview.cir
    scenarios:
      - id: rev2_amp_preview
        measures:
          - id: rev2_vin_min
            title: "Rev-2 preview: WiFi + 3W amp on fresh pack — VIN minimum"
            group: rev2_amp
            min: 3.5
          - id: rev2_v3v3_min
            title: "Rev-2 preview — 3V3 holds under combined load"
            group: rev2_amp
            min: 3.25
          - id: rev2_v5v_min
            title: "Rev-2 preview — 5V amp rail holds"
            group: rev2_amp
            min: 4.9

plots:
  - file: tran-vout-battery.png
    signal: v(3v3)
  - file: tran-vbat-sw.png
    signal: v(pfet)
